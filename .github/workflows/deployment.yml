name: Deployment checks

# Vercel's repository_dispatch event is meant to start this after each deployment, but it hasn't
# arrived for this repo yet (D-043). Until it does, start it by hand with workflow_dispatch.
on:
  repository_dispatch:
    types: [vercel.deployment.success]
  # Run the same checks by hand against a deployment, e.g. when Vercel's event doesn't arrive:
  # gh workflow run deployment.yml -f url=<deployment url> -f sha=<commit> -f environment=preview
  workflow_dispatch:
    inputs:
      url:
        description: The deployment's own URL (fogline-<hash>-achyut-katiyars-projects.vercel.app), not a branch or production alias
        required: true
      sha:
        description: Commit that deployment was built from
        required: true
      environment:
        description: Deployment environment
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read
  statuses: write

concurrency:
  group: deployment-${{ github.event.client_payload.environment || inputs.environment }}-${{ github.event.client_payload.git.sha || inputs.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHA: ${{ github.event.client_payload.git.sha || inputs.sha }}
      STATUS_CONTEXT: e2e on ${{ github.event.client_payload.environment || inputs.environment }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Only commits on this repository's own branches run with the bypass secret. A fork's code
      # never gets it.
      - name: Check the commit belongs to this repository
        id: owned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/branches-where-head" --jq length)
          if [ "$count" -gt 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "::error::$SHA is not the head of a branch in this repository, so nothing was tested."
            exit 1
          else
            echo "::notice::Skipped $SHA: not the head of a branch in this repository (a fork or an older commit)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mark the deployed commit pending
        if: steps.owned.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA"
          -f state=pending -f context="$STATUS_CONTEXT" -f target_url="$RUN_URL"
      - uses: actions/checkout@v7
        if: steps.owned.outputs.run == 'true'
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        if: steps.owned.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.owned.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.owned.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.owned.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
      # No report is uploaded: Playwright error messages include request headers.
      - id: e2e
        if: steps.owned.outputs.run == 'true'
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.client_payload.url || inputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.client_payload.environment || inputs.environment }}
        run: pnpm test:e2e:deployment
      - name: Report the result on the deployed commit
        if: always() && steps.owned.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          case "$OUTCOME" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" -f target_url="$RUN_URL"
